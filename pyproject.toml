[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-rendezvous"
version = "0.1.0"
description = "Phase 1: recorded responses of one pretrained Flyvis model"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy", "flyvis==1.2.0", "rerun-sdk==0.37.1", "trimesh", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires official checkpoint and CUDA"]
